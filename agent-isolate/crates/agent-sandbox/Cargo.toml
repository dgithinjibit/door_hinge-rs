[package]
name = "agent-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Process isolation: Landlock, seccomp, namespaces (Linux), sandbox-exec (macOS)."

[dependencies]
agent-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
nix = { version = "0.29", features = ["process", "sched", "user", "signal", "mount", "resource", "net", "ioctl"] }
libc = "0.2"
which = "6.0"
netlink-packet-route = "0.19"
netlink-sys = "0.8"

[dev-dependencies]
tempfile = "3"

[lints.rust]
# Override workspace forbid for unsafe_code - required for seccomp syscalls and namespace operations
unsafe_code = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "allow"
print_stderr = "allow"
needless_borrow = "warn"
redundant_clone = "warn"
manual_let_else = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
