[package]
name = "pipelock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AI agent firewall: agent egress control, DLP, SSRF, and prompt injection defense (Rust)."

[[bin]]
name = "pipelock"
path = "src/main.rs"

[dependencies]
pipelock-core = { workspace = true }
pipelock-config = { workspace = true }
pipelock-scanner = { workspace = true }
pipelock-proxy = { workspace = true }
pipelock-recorder = { workspace = true }
pipelock-audit = { workspace = true }
pipelock-killswitch = { workspace = true }

clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
pipelock-sandbox = { workspace = true }

[lints]
workspace = true
